name: Validate RaceDay Repository

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required folders and files
        run: |
          test -d docs
          test -f docs/ERD.png
          test -f docs/RaceDay.sql
          test -f docs/API-Endpoint-Plan.md
          test -f README.md
          test -f RaceDay.slnx
          test -d RaceDay.Api
          test -d RaceDay.Api.Tests
          test -d RaceDay.Api/Controllers
          test -d RaceDay.Api/Models
          test -d RaceDay.Api/Dtos
          test -d RaceDay.Api/Services
          test -d RaceDay.Api/Data
