name: Validate RaceDay Repository

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate repository contents
        run: |
          test -d docs
          test -f docs/ERD.png
          test -f docs/RaceDay.sql
          test -f docs/API-Endpoint-Plan.md
          test -f README.md
          test -f RaceDay.slnx
          test -d RaceDay.Api
          test -d RaceDay.Api.Tests
          test -d RaceDay.Api/Controllers
          test -d RaceDay.Api/Models
          test -d RaceDay.Api/Dtos
          test -d RaceDay.Api/Services
          test -d RaceDay.Api/Data
          test "$(grep -c '^    CLUB {' docs/ERD.md)" -eq 1
          ! grep -Eq 'HASH_|Phenyo|Nkhumane|9001015009089' docs/RaceDay.sql RaceDay.Api/RaceDay.Api.http
          grep -q 'workflows/dotNET.yml' README.md
          if git ls-files | grep -Eq '(^|/)\.vs/'; then
            echo "Tracked Visual Studio workspace data must not be committed."
            exit 1
          fi
